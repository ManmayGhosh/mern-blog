version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: inkwell-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - inkwell-net

  server:
    build: ./server
    container_name: inkwell-server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/blogapp
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_string}
      CLIENT_URL: http://localhost:8080
    volumes:
      - uploads-posts:/app/uploads/posts
      - uploads-avatars:/app/uploads/avatars
    ports:
      - "5000:5000"
    networks:
      - inkwell-net

  client:
    build: ./client
    container_name: inkwell-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"
    networks:
      - inkwell-net

networks:
  inkwell-net:
    driver: bridge

volumes:
  mongo-data:
  uploads-posts:
  uploads-avatars:
